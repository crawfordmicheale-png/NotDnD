name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than dropping a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enables Pages when the repository has none configured at all. It does
          # NOT convert an existing "Deploy from a branch" site to Actions: on such
          # a repo this step is a silent no-op. Switching the source is a manual
          # prerequisite — Settings > Pages > Build and deployment > Source:
          # "GitHub Actions" — which the next step checks for.
          enablement: true

      # actions/deploy-pages reports success even when the repository still
      # publishes from a branch: it creates a deployment that the branch build then
      # overwrites, so CI stays green while the live site serves the repo root
      # (index.html loading src/main.ts, which browsers block on MIME type).
      # Fail here instead, where the cause is visible.
      - name: Verify Pages publishes from this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          if [ "$status" != "200" ]; then
            echo "::error::Could not read the Pages configuration (HTTP $status): $body"
            exit 1
          fi

          build_type=$(printf '%s' "$body" | jq -r '.build_type // "unset"')
          echo "Pages build_type: $build_type"

          if [ "$build_type" != "workflow" ]; then
            echo "Pages publishes from '$build_type', so a branch build - not this"
            echo "workflow's artifact - is what the site actually serves, and it"
            echo "overwrites the deployment this run would create."
            echo "Fix: Settings > Pages > Build and deployment > Source: 'GitHub Actions'."
            echo "::error::Pages publishes from '$build_type', not 'workflow'. Set Settings > Pages > Build and deployment > Source to 'GitHub Actions'."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
